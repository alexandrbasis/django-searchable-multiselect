[project]
name = "django-searchable-multiselect"
version = "2.0.0"
description = "Django admin multi-select filter with searchable dropdown and chips UI"
readme = "README.md"
authors = [{ name = "Alexandr Basis", email = "basisalexandr@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["django", "admin", "filter", "multi-select", "searchable", "dropdown"]

dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
django42 = ["django~=4.2.0"]
django52 = ["django~=5.2.0"]
test = ["pytest", "pytest-django", "factory_boy", "pytest-cov"]

[project.urls]
homepage = "https://github.com/alexandrbasis/django-searchable-multiselect"
repository = "https://github.com/alexandrbasis/django-searchable-multiselect"
documentation = "https://github.com/alexandrbasis/django-searchable-multiselect#readme"

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.html"]

[tool.ruff]
line-length = 119
output-format = "grouped"
show-fixes = true
target-version = "py39"
exclude = [".svn", "CVS", ".bzr", ".hg",".git", "__pycache__", ".tox", ".eggs", "*.egg", ".venv", "env", "venv", "build"]

[tool.ruff.lint]
select = ["W", "E", "F", "I", "N", "DJ", "T20", "Q"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.app.settings"
addopts = "-ra -q"
pythonpath =". src"
